# goreleaser configuration — see https://goreleaser.com
#
# Rehearsed on a real v0.2.0 tag before the 1.0 release, so the first
# real exercise of this pipeline isn't the 1.0 tag itself. Iterate
# locally with:
#
#     goreleaser release --snapshot --clean
#
# `goreleaser check` will flag `brews` as deprecated and exit non-zero —
# that's expected and deliberate (see the brews: block below). `release`
# only warns and proceeds, which is what CI runs.
#
# The tap push (brews:) and cosign signing (signs:) only run on a real
# tag in CI — --snapshot skips both.
version: 2

project_name: umerge

before:
  hooks:
    - go mod download
    - go test ./...

builds:
  - id: umerge
    main: .
    binary: umerge
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: umerge
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - umerge.1

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Keyless signing over the checksums file: Sigstore/Fulcio issues a
# short-lived cert bound to the GitHub Actions OIDC identity, so there
# is no key material to store or rotate. Verify a download with:
#
#     cosign verify-blob \
#       --certificate checksums.txt.pem \
#       --signature checksums.txt.sig \
#       --certificate-identity-regexp 'https://github.com/mcjames/umerge/.+' \
#       --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#       checksums.txt
signs:
  - cmd: cosign
    artifacts: checksum
    signature: ${artifact}.sig
    certificate: ${artifact}.pem
    args:
      - sign-blob
      - --yes
      - --output-signature=${signature}
      - --output-certificate=${certificate}
      - ${artifact}
    output: true

nfpms:
  - id: umerge
    package_name: umerge
    vendor: Michael James
    homepage: https://github.com/mcjames/umerge
    maintainer: Michael James <1919111+mcjames@users.noreply.github.com>
    description: >-
      Terminal-native two-way and three-way directory comparison and
      merge tool, also usable as a `git difftool -d` backend.
    license: BSD-3-Clause
    formats:
      - deb
      - rpm
    section: utils
    bindir: /usr/bin
    contents:
      - src: ./umerge.1
        dst: /usr/share/man/man1/umerge.1
        file_info:
          mode: 0644

# Homebrew FORMULA (not cask), a deliberate choice against goreleaser's
# current recommendation. Casks are NOT macOS-only anymore (Homebrew
# 4.5.0, Apr 2025, added Linux support for binary-only casks), so this
# isn't "the only thing that works on Linux" — it's the smoother option:
#   - No Homebrew-version floor. A cask needs the user on >= 4.5.0 and,
#     on Linux, historically `brew install --cask <tap>/<name>` (bare
#     `brew install` didn't resolve tap casks on Linux → "I broke
#     everyone" reports). A formula: plain `brew install`, any version.
#   - A formula-installed binary is not quarantined by Homebrew, so the
#     macOS "unidentified developer" Gatekeeper dialog never appears —
#     that's a cask-only side effect. No xattr hook, no caveats needed.
#   - `brew upgrade` picks up new formula versions; it silently skips
#     casks unless they're version-pinned.
#   - For a single static binary the generated formula is ~60 clean lines
#     (per-OS/arch tarball download + bin/man install); goreleaser's
#     "hackyish formulas" warning is about complex apps, not this.
# Cost: `brews` is deprecated — soft since goreleaser v2.10, fully since
# v2.16. `goreleaser check` exits non-zero on it; `goreleaser release`
# (what CI runs) only warns and proceeds. Removal is slated for v3, which
# has no date and isn't on the roadmap. If v3 ever ships: commit this
# ~60-line formula straight into the tap and bump it with a small
# workflow step, or migrate to homebrew_casks (mechanical).
brews:
  - name: umerge
    repository:
      owner: mcjames
      name: homebrew-umerge
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/mcjames/umerge
    description: Terminal-native two-way and three-way directory comparison and merge tool
    license: BSD-3-Clause
    commit_author:
      name: goreleaser-bot
      email: 1919111+mcjames@users.noreply.github.com
    install: |
      bin.install "umerge"
      man1.install "umerge.1"
    test: |
      assert_match version.to_s, shell_output("#{bin}/umerge --version")

release:
  github:
    owner: mcjames
    name: umerge
  prerelease: auto
  draft: false
  mode: replace

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "Merge pull request"
      - "Merge branch"
